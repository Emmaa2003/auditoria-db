spring.application.name=auditoria-bd

# Conexion a Oracle (usa variables de entorno en produccion, con valores por defecto para desarrollo local)
spring.datasource.url=${DATABASE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DATABASE_USERNAME:auditoria}
spring.datasource.password=${DATABASE_PASSWORD:Auditoria_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA / Hibernate - el esquema ya existe, Hibernate solo valida el mapeo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

server.port=8080

# Monitor de salud de Oracle
monitor.oracle.polling-interval-ms=${MONITOR_POLL_MS:60000}
monitor.oracle.peso-procesos=0.30
monitor.oracle.peso-memoria=0.35
monitor.oracle.peso-archivos=0.35
