<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Catálogo de controles')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <h1 class="h3 mb-3">Catálogo de controles ISO/IEC 27002</h1>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Dominio</th>
                    <th>Peso</th>
                    <th>C</th>
                    <th>I</th>
                    <th>D</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${controles}">
                    <td><span class="badge bg-secondary" th:text="${c.codigo}"></span></td>
                    <td th:text="${c.nombre}"></td>
                    <td th:text="${c.dominio}"></td>
                    <td th:text="${c.peso}"></td>
                    <td th:text="${c.afectaC} ? '✓' : ''"></td>
                    <td th:text="${c.afectaI} ? '✓' : ''"></td>
                    <td th:text="${c.afectaD} ? '✓' : ''"></td>
                    <td class="text-end">
                        <a th:href="@{/admin/catalogo/{id}(id=${c.idControl})}" class="btn btn-sm btn-outline-primary">Ver / editar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
