<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Iniciar sesión')}"></head>
<body class="d-flex align-items-center" style="min-height: 100vh;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title mb-1 text-center">Auditoría BD</h3>
                    <p class="text-muted text-center mb-4">Auditoría de seguridad ISO/IEC 27002</p>

                    <div class="alert alert-danger" th:if="${param.error}">
                        Correo o contraseña incorrectos.
                    </div>
                    <div class="alert alert-success" th:if="${param.logout}">
                        Sesión cerrada correctamente.
                    </div>

                    <form th:action="@{/login}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label">Correo</label>
                            <input type="email" class="form-control" id="username" name="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
