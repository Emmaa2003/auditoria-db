<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' · Auditoría BD'">Auditoría BD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fa; }
        .navbar-brand { font-weight: 600; }
        .heatmap-cell { border-radius: .375rem; padding: .75rem; color: #fff; text-align: center; font-weight: 600; }
        .riesgo-bajo { background-color: #198754; }
        .riesgo-medio { background-color: #ffc107; color: #212529; }
        .riesgo-alto { background-color: #fd7e14; }
        .riesgo-critico { background-color: #dc3545; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 no-print">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Auditoría BD · ISO 27002</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/organizaciones}">Organizaciones</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/auditorias/nueva}">Nueva auditoría</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/admin/catalogo}">Catálogo de controles</a>
                </li>
            </ul>
            <ul class="navbar-nav" sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                <li class="nav-item">
                    <span class="navbar-text me-3" sec:authentication="name">usuario</span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
</body>
</html>
