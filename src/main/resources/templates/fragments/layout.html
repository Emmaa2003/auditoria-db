<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' · Auditoría BD'">Auditoría BD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --rrrv-primary: #5B9BD5;
            --rrrv-primary-mid: #3E7CA6;
            --rrrv-primary-dark: #2C5F7C;
            --rrrv-primary-darker: #1E3F52;
            --rrrv-bg: #F4F7FA;
            --rrrv-ink: #1E293B;
            --rrrv-ink-soft: #55637A;
        }

        html, body {
            height: 100%;
        }
        body {
            background-color: var(--rrrv-bg);
            color: var(--rrrv-ink);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        main {
            flex: 1 0 auto;
        }
        footer {
            flex-shrink: 0;
        }

        h1, h2, h3, h4, h5, .navbar-brand, .card-title {
            font-family: 'Archivo', 'Inter', sans-serif;
            font-weight: 800;
        }

        /* Barra de firma: las 4 barras del logo, reutilizadas como divisor de sección */
        .rrrv-divider {
            display: flex;
            gap: 4px;
            width: 56px;
            height: 8px;
            margin-bottom: .75rem;
        }
        .rrrv-divider span { flex: 1; border-radius: 2px; }
        .rrrv-divider span:nth-child(1) { background: var(--rrrv-primary); }
        .rrrv-divider span:nth-child(2) { background: var(--rrrv-primary-mid); }
        .rrrv-divider span:nth-child(3) { background: var(--rrrv-primary-dark); }
        .rrrv-divider span:nth-child(4) { background: var(--rrrv-primary-darker); }

        .heatmap-cell { border-radius: .375rem; padding: .75rem; color: #fff; text-align: center; font-weight: 600; }
        .riesgo-bajo { background-color: #198754; }
        .riesgo-medio { background-color: #ffc107; color: #212529; }
        .riesgo-alto { background-color: #fd7e14; }
        .riesgo-critico { background-color: #dc3545; }
        @media print {
            .no-print { display: none !important; }
        }
    </style>
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark mb-4 no-print" style="background-color: var(--rrrv-primary-darker);">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" th:href="@{/panel}">
            <img th:src="@{/img/logo-horizontal.svg}" alt="Grupo RRRV" height="36">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto" sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                <li class="nav-item"><a class="nav-link" th:href="@{/panel}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/organizaciones}">Organizaciones</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/auditorias/nueva}">Nueva auditoría</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                    <a class="nav-link" th:href="@{/admin/catalogo}">Catálogo de controles</a>
                </li>
            </ul>
            <ul class="navbar-nav" sec:authorize="isAuthenticated()" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
                <li class="nav-item">
                    <span class="navbar-text me-3" sec:authentication="name">usuario</span>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>
<footer th:fragment="footer" class="no-print mt-5 py-4" style="background-color: var(--rrrv-primary-darker); color: #CBD5E1;">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div class="d-flex align-items-center gap-2">
            <img th:src="@{/img/logo-icon.svg}" alt="Grupo RRRV" height="24">
            <span>&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> Grupo RRRV · Soluciones de Datos</span>
        </div>
        <div class="small text-center text-md-end">
            San José, Costa Rica &nbsp;·&nbsp; +506 2240-1041 &nbsp;·&nbsp;
            <a href="mailto:contacto@gruporrrv.com" class="link-light">contacto@gruporrrv.com</a>
        </div>
    </div>
</footer>
</body>
</html>
