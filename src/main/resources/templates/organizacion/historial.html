<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Historial de auditorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="h3 mb-0" th:text="'Historial · ' + ${organizacion.nombre}"></h1>
            <p class="text-muted mb-0" th:text="${organizacion.areaEvaluada}"></p>
        </div>
        <a th:href="@{/organizaciones}" class="btn btn-outline-secondary">Volver</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th>Fecha de auditoría</th>
                    <th>Auditor</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="aud : ${auditorias}">
                    <td th:text="${#temporals.format(aud.fechaAuditoria, 'dd/MM/yyyy')}"></td>
                    <td th:text="${aud.auditor.nombre}"></td>
                    <td>
                        <span class="badge" th:classappend="${aud.estado.name() == 'FINALIZADA'} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${aud.estado.name() == 'FINALIZADA'} ? 'Finalizada' : 'En progreso'"></span>
                    </td>
                    <td class="text-end">
                        <a th:if="${aud.estado.name() == 'FINALIZADA'}" th:href="@{/auditorias/{id}/resultados(id=${aud.idAuditoria})}" class="btn btn-sm btn-outline-primary">Ver resultados</a>
                        <a th:if="${aud.estado.name() == 'EN_PROGRESO'}" th:href="@{/auditorias/{id}/cuestionario(id=${aud.idAuditoria})}" class="btn btn-sm btn-outline-warning">Continuar</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(auditorias)}">
                    <td colspan="4" class="text-center text-muted py-4">Esta organización no tiene auditorías registradas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
